# === Shell completion help ===

[CompletionCmdShort]
other = "Generate the autocompletion script for the specified shell"

[CompletionCmdLong]
other = "Generate the autocompletion script for {{.Command}} for the specified shell.\nSee each sub-command's help for details on how to use the generated script."

[CompletionShellShort]
other = "Generate the autocompletion script for {{.Shell}}"

[CompletionFlagNoDescriptions]
other = "disable completion descriptions"

[CompletionBashLong]
other = "Generate the autocompletion script for the bash shell.\n\nThis script depends on the 'bash-completion' package.\nIf it is not installed already, you can install it via your OS's package manager.\n\nTo load completions in your current shell session:\n\n\tsource <({{.Command}} completion bash)\n\nTo load completions for every new session, execute once:\n\n#### Linux:\n\n\t{{.Command}} completion bash > /etc/bash_completion.d/{{.Command}}\n\n#### macOS:\n\n\t{{.Command}} completion bash > $(brew --prefix)/etc/bash_completion.d/{{.Command}}\n\nYou will need to start a new shell for this setup to take effect.\n"

[CompletionZshLong]
other = "Generate the autocompletion script for the zsh shell.\n\nIf shell completion is not already enabled in your environment you will need\nto enable it.  You can execute the following once:\n\n\techo \"autoload -U compinit; compinit\" >> ~/.zshrc\n\nTo load completions in your current shell session:\n\n\tsource <({{.Command}} completion zsh)\n\nTo load completions for every new session, execute once:\n\n#### Linux:\n\n\t{{.Command}} completion zsh > \"${fpath[1]}/_{{.Command}}\"\n\n#### macOS:\n\n\t{{.Command}} completion zsh > $(brew --prefix)/share/zsh/site-functions/_{{.Command}}\n\nYou will need to start a new shell for this setup to take effect.\n"

[CompletionFishLong]
other = "Generate the autocompletion script for the fish shell.\n\nTo load completions in your current shell session:\n\n\t{{.Command}} completion fish | source\n\nTo load completions for every new session, execute once:\n\n\t{{.Command}} completion fish > ~/.config/fish/completions/{{.Command}}.fish\n\nYou will need to start a new shell for this setup to take effect.\n"

[CompletionPowershellLong]
other = "Generate the autocompletion script for powershell.\n\nTo load completions in your current shell session:\n\n\t{{.Command}} completion powershell | Out-String | Invoke-Expression\n\nTo load completions for every new session, add the output of the above command\nto your powershell profile.\n"

