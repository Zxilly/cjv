version: 2
env:
  - CGO_ENABLED=0
  - GOTOOLCHAIN=local
builds:
  - id: cjv
    main: ./cmd/cjv
    binary: cjv
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
      - -X main.updateURL=https://github.com/Zxilly/cjv/releases
    targets: [linux_amd64, linux_arm64, darwin_amd64, darwin_arm64, windows_amd64, openharmony_amd64, openharmony_arm64]
    tool: '{{ if eq .Os "openharmony" }}{{ .Env.HMOS_GO }}{{ else }}go{{ end }}'
    hooks:
      post:
        - cmd: >-
            sh -c 'if [ "{{ .Os }}" = openharmony ]; then "{{ .Env.HMOS_SIGN }}" "{{ .Path }}" "{{ .Path }}"; fi'

  - id: cjv-mirror
    main: ./cmd/cjv
    binary: cjv-mirror
    flags:
      - -tags=mirror
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
      - -X main.updateURL=https://gitcode.com/Zxilly/cjv/releases
    targets: [linux_amd64, linux_arm64, darwin_amd64, darwin_arm64, windows_amd64, openharmony_amd64, openharmony_arm64]
    tool: '{{ if eq .Os "openharmony" }}{{ .Env.HMOS_GO }}{{ else }}go{{ end }}'
    hooks:
      post:
        - cmd: >-
            sh -c 'if [ "{{ .Os }}" = openharmony ]; then "{{ .Env.HMOS_SIGN }}" "{{ .Path }}" "{{ .Path }}"; fi'

archives:
  - id: cjv
    ids: [cjv]
    name_template: "cjv_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
  - id: cjv-mirror
    ids: [cjv-mirror]
    name_template: "cjv-mirror_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "checksums.txt"
