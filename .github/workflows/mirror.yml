name: Sync GitCode

on:
  push:
    branches: [master]
    tags: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitcode-mirror
  cancel-in-progress: false

jobs:
  sync:
    name: Sync master and tags
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0
      - name: Push master and tags to GitCode
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          git remote add gitcode "https://Zxilly:${GITCODE_TOKEN}@gitcode.com/Zxilly/cjv.git"
          git push gitcode "HEAD:refs/heads/master" --tags
