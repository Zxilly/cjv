name: CI
on:
  push:
    branches: [master]
  pull_request:

jobs:
  go-test:
    name: Go test (${{ matrix.os }})
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            race: -race
          - os: ubuntu-24.04-arm
            race: -race
          - os: macos-26
            race: -race
          - os: macos-26-intel
            race: -race
          - os: windows-2025
            race: -race
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Build all packages
        run: go build ./...
      - name: Build mirror variant
        run: go build -tags=mirror ./...
      - name: Run tests
        run: go test ${{ matrix.race }} -count=1 -timeout 300s ./...
      - name: Run mirror tests
        run: go test -tags=mirror ${{ matrix.race }} -count=1 -timeout 300s ./internal/selfupdate/...
      - name: Test OpenHarmony preparation logic on the host
        run: go test -tags=openharmony ${{ matrix.race }} -count=1 -timeout 300s ./internal/ohos/... ./internal/config ./internal/dist
      - name: Run go vet
        run: go vet ./...
      - name: Run go vet (mirror)
        run: go vet -tags=mirror ./...

  lint:
    name: Go lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Run markdownlint
        run: npx --yes markdownlint-cli2@0.22.1

  cross-build:
    name: Cross build (${{ matrix.goos }}/${{ matrix.goarch }})
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        run: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -o /dev/null ./cmd/cjv/

  mod-check:
    name: Go mod check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: Verify module integrity
        run: go mod verify

  vuln-check:
    name: Vulnerability check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Install govulncheck
        # Pinned to v1.3.0: v1.4.0 (built on x/tools v0.46.0) panics on Go 1.26
        # with "ForEachElement called on type containing *types.TypeParam".
        # See golang/go#80055 (root cause) / #80059. Unpin once x/vuln ships the fix.
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
      - name: Run govulncheck
        run: govulncheck ./...

  web-build:
    name: Web build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Build web
        working-directory: web
        run: pnpm build

  web-test:
    name: Web test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Resolve Playwright version
        id: playwright-version
        working-directory: web
        shell: bash
        run: |
          version=$(node -p "require('playwright/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright Chromium
        working-directory: web
        timeout-minutes: 15
        env:
          DEBUG: pw:install
          PLAYWRIGHT_SKIP_BROWSER_GC: '1'
        run: pnpm exec playwright install --with-deps chromium
      - name: Run tests
        working-directory: web
        env:
          VITEST_BROWSER: chromium
        run: pnpm exec vitest run --exclude src/App.platform.integration.test.tsx

  web-coverage:
    name: Web coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Resolve Playwright version
        id: playwright-version
        working-directory: web
        shell: bash
        run: |
          version=$(node -p "require('playwright/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright Chromium
        working-directory: web
        timeout-minutes: 15
        env:
          DEBUG: pw:install
          PLAYWRIGHT_SKIP_BROWSER_GC: '1'
        run: pnpm exec playwright install --with-deps chromium
      - name: Run coverage
        working-directory: web
        env:
          VITEST_BROWSER: chromium
        run: pnpm coverage

  web-browser-integration:
    name: Web integration (${{ matrix.runner.os }} · ${{ matrix.runner.platform_os }}, ${{ matrix.browser }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        runner:
          - os: windows-11-arm
            arch: arm64
            platform_os: Windows
            platform_arch: arm64
            expected_state: unsupported
            expected_label: Windows arm64
            expected_binary_goos: ''
            expected_binary_goarch: ''
          - os: macos-26-intel
            arch: amd64
            platform_os: Mac OS
            platform_arch: ''
            expected_state: ready
            expected_label: macOS
            expected_binary_goos: ''
            expected_binary_goarch: ''
          - os: macos-26
            arch: arm64
            platform_os: Mac OS
            platform_arch: ''
            expected_state: ready
            expected_label: macOS
            expected_binary_goos: ''
            expected_binary_goarch: ''
          - os: windows-2025
            arch: amd64
            platform_os: Windows
            platform_arch: amd64
            expected_state: ready
            expected_label: Windows x86_64
            expected_binary_goos: windows
            expected_binary_goarch: amd64
          - os: ubuntu-24.04
            arch: amd64
            platform_os: Linux
            platform_arch: amd64
            expected_state: ready
            expected_label: Linux x86_64
            expected_binary_goos: linux
            expected_binary_goarch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
            platform_os: Linux
            platform_arch: arm64
            expected_state: ready
            expected_label: Linux ARM64
            expected_binary_goos: linux
            expected_binary_goarch: arm64
          - os: ubuntu-24.04
            arch: amd64
            platform_os: iOS
            platform_arch: ''
            expected_state: unsupported
            expected_label: iOS
            expected_binary_goos: ''
            expected_binary_goarch: ''
          - os: ubuntu-24.04
            arch: amd64
            platform_os: Android
            platform_arch: ''
            expected_state: unsupported
            expected_label: Android
            expected_binary_goos: ''
            expected_binary_goarch: ''
    runs-on: ${{ matrix.runner.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Resolve Playwright version
        id: playwright-version
        working-directory: web
        shell: bash
        run: |
          version=$(node -p "require('playwright/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
            ~/AppData/Local/ms-playwright
          key: playwright-${{ matrix.runner.os }}-${{ matrix.browser }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright browser with Linux deps
        if: runner.os == 'Linux'
        working-directory: web
        timeout-minutes: 15
        env:
          DEBUG: pw:install
          PLAYWRIGHT_SKIP_BROWSER_GC: '1'
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: Install Playwright browser
        if: runner.os != 'Linux'
        working-directory: web
        timeout-minutes: 15
        env:
          DEBUG: pw:install
          PLAYWRIGHT_SKIP_BROWSER_GC: '1'
        run: pnpm exec playwright install ${{ matrix.browser }}
      - name: Run platform integration tests
        working-directory: web
        env:
          VITEST_BROWSER: ${{ matrix.browser }}
          VITE_EXPECTED_BINARY_GOARCH: ${{ matrix.runner.expected_binary_goarch }}
          VITE_EXPECTED_BINARY_GOOS: ${{ matrix.runner.expected_binary_goos }}
          VITE_EXPECTED_BROWSER: ${{ matrix.browser }}
          VITE_EXPECTED_LABEL: ${{ matrix.runner.expected_label }}
          VITE_EXPECTED_PLATFORM_ARCH: ${{ matrix.runner.platform_arch }}
          VITE_EXPECTED_PLATFORM_OS: ${{ matrix.runner.platform_os }}
          VITE_EXPECTED_PLAYWRIGHT_BROWSER: ${{ matrix.browser }}
          VITE_EXPECTED_RUNNER: ${{ matrix.runner.os }}
          VITE_EXPECTED_RUNNER_ARCH: ${{ matrix.runner.arch }}
          VITE_EXPECTED_STATE: ${{ matrix.runner.expected_state }}
        run: pnpm test:integration

  install-script-integration:
    name: Installer (${{ matrix.label }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux sh
            os: ubuntu-24.04
            kind: unix
            shell_name: sh
            test_mode: path
            apt_packages: ''
            brew_packages: ''
            default_toolchain: ''
          - label: linux bash
            os: ubuntu-24.04
            kind: unix
            shell_name: bash
            test_mode: path
            apt_packages: ''
            brew_packages: ''
            default_toolchain: ''
          - label: linux zsh
            os: ubuntu-24.04
            kind: unix
            shell_name: zsh
            test_mode: path
            apt_packages: zsh
            brew_packages: ''
            default_toolchain: ''
          - label: linux fish
            os: ubuntu-24.04
            kind: unix
            shell_name: fish
            test_mode: path
            apt_packages: fish
            brew_packages: ''
            default_toolchain: ''
          - label: linux arm64 sh
            os: ubuntu-24.04-arm
            kind: unix
            shell_name: sh
            test_mode: path
            apt_packages: ''
            brew_packages: ''
            default_toolchain: ''
          - label: macos arm64 bash
            os: macos-26
            kind: unix
            shell_name: bash
            test_mode: path
            apt_packages: ''
            brew_packages: ''
            default_toolchain: ''
          - label: macos arm64 zsh
            os: macos-26
            kind: unix
            shell_name: zsh
            test_mode: path
            apt_packages: ''
            brew_packages: ''
            default_toolchain: ''
          - label: macos arm64 fish
            os: macos-26
            kind: unix
            shell_name: fish
            test_mode: path
            apt_packages: ''
            brew_packages: fish
            default_toolchain: ''
          - label: macos intel bash
            os: macos-26-intel
            kind: unix
            shell_name: bash
            test_mode: path
            apt_packages: ''
            brew_packages: ''
            default_toolchain: ''
          - label: macos intel zsh
            os: macos-26-intel
            kind: unix
            shell_name: zsh
            test_mode: path
            apt_packages: ''
            brew_packages: ''
            default_toolchain: ''
          - label: macos intel fish
            os: macos-26-intel
            kind: unix
            shell_name: fish
            test_mode: path
            apt_packages: ''
            brew_packages: fish
            default_toolchain: ''
          - label: windows powershell legacy host
            os: windows-2025
            kind: powershell
            shell_name: 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
            test_mode: ''
            apt_packages: ''
            brew_packages: ''
            default_toolchain: all
          - label: windows pwsh latest
            os: windows-2025
            kind: powershell
            shell_name: pwsh
            test_mode: ''
            apt_packages: ''
            brew_packages: ''
            default_toolchain: all
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux test shells
        if: matrix.kind == 'unix' && runner.os == 'Linux' && matrix.apt_packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt_packages }}
      - name: Install macOS test shells
        if: matrix.kind == 'unix' && runner.os == 'macOS' && matrix.brew_packages != ''
        run: brew install ${{ matrix.brew_packages }}
      - name: Show Unix shell version
        if: matrix.kind == 'unix'
        run: |
          if command -v ${{ matrix.shell_name }}; then
            ${{ matrix.shell_name }} --version || true
          fi
      - name: Show PowerShell version
        if: matrix.kind == 'powershell'
        shell: pwsh
        env:
          CJV_INSTALL_TEST_POWERSHELL: ${{ matrix.shell_name }}
        run: |
          $shell = Get-Command $env:CJV_INSTALL_TEST_POWERSHELL -ErrorAction Stop
          $shellPath = if ($shell.Path) { $shell.Path } else { $shell.Source }
          & $shellPath -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
      - name: Run install.sh integration
        if: matrix.kind == 'unix'
        env:
          CJV_INSTALL_TEST_SHELL: ${{ matrix.shell_name }}
          CJV_INSTALL_TEST_MODE: ${{ matrix.test_mode }}
        run: sh tests/install-scripts/install-sh.sh
      - name: Run install.ps1 integration
        if: matrix.kind == 'powershell'
        shell: pwsh
        env:
          CJV_INSTALL_TEST_DEFAULT_TOOLCHAIN: ${{ matrix.default_toolchain }}
          CJV_INSTALL_TEST_POWERSHELL: ${{ matrix.shell_name }}
        run: ./tests/install-scripts/install-ps1.ps1

  go-integration:
    name: Go integration (${{ matrix.os }})
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            race: -race
          - os: ubuntu-24.04-arm
            race: -race
          - os: macos-26
            race: -race
          - os: macos-26-intel
            race: -race
          - os: windows-2025
            race: -race
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Run integration tests
        run: go test ${{ matrix.race }} -v -tags integration -count=1 ./tests/integration/
