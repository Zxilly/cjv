name: CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-24.04
    outputs:
      go: ${{ steps.scope.outputs.go }}
      web: ${{ steps.scope.outputs.web }}
      docs: ${{ steps.scope.outputs.docs }}
      installers: ${{ steps.scope.outputs.installers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: scope
        run: python3 scripts/ci-scope.py

  go-test:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    name: Go test (${{ matrix.os }})
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            race: -race
          - os: ubuntu-24.04-arm
            race: -race
          - os: macos-26
            race: -race
          - os: macos-26-intel
            race: -race
          - os: windows-2025
            race: -race
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Build all packages
        run: go build ./...
      - name: Build mirror variant
        run: go build -tags=mirror ./...
      - name: Run tests
        run: go test ${{ matrix.race }} -count=1 -timeout 300s ./...
      - name: Run mirror tests
        run: go test -tags=mirror ${{ matrix.race }} -count=1 -timeout 300s ./internal/selfupdate/...
      - name: Test OpenHarmony preparation logic on the host
        run: go test -tags=openharmony ${{ matrix.race }} -count=1 -timeout 300s ./internal/ohos/... ./internal/config ./internal/dist
      - name: Run go vet
        run: go vet ./...
      - name: Run go vet (mirror)
        run: go vet -tags=mirror ./...

  lint:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    name: Go lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Validate CI path classification
        run: python3 scripts/test_ci_scope.py
      - name: Test release resolution and verified installer extraction
        run: bash tests/release-scripts/release-scripts.sh

  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Run markdownlint
        run: npx --yes markdownlint-cli2@0.22.1

  docs-build:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    name: Documentation build and links
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install mdbook
        env:
          MDBOOK_VERSION: "0.5.3"
        run: |
          mkdir -p "${RUNNER_TEMP}/mdbook-bin"
          curl -fsSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "${RUNNER_TEMP}/mdbook-bin"
          echo "${RUNNER_TEMP}/mdbook-bin" >> "$GITHUB_PATH"
      - name: Build and check the bilingual documentation
        run: python3 scripts/build-docs.py

  cross-build:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    name: Cross build (${{ matrix.goos }}/${{ matrix.goarch }})
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        run: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -o /dev/null ./cmd/cjv/

  mod-check:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    name: Go mod check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: Verify module integrity
        run: go mod verify

  vuln-check:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    name: Vulnerability check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Run govulncheck
        run: govulncheck ./...

  web-build:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    name: Web build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up web dependencies
        uses: ./.github/actions/setup-web
      - name: Build web
        working-directory: web
        run: pnpm build
      - name: Test edge deployment bundles
        run: node --test deployment/edge.test.mjs
      - name: Upload built website for native browsers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-built
          path: web/dist
          retention-days: 3

  web-test:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    name: Web test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up web dependencies
        uses: ./.github/actions/setup-web
      - name: Set up Playwright Chromium
        uses: ./.github/actions/setup-playwright
        timeout-minutes: 15
        with:
          browser: chromium
      - name: Run tests with coverage
        working-directory: web
        env:
          VITEST_BROWSER: chromium
        run: pnpm coverage

  web-browser-integration:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    name: Web integration (${{ matrix.browser }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up web dependencies
        uses: ./.github/actions/setup-web
      - name: Set up Playwright browser
        uses: ./.github/actions/setup-playwright
        timeout-minutes: 15
        with:
          browser: ${{ matrix.browser }}
      - name: Run platform integration tests
        working-directory: web
        env:
          VITEST_BROWSER: ${{ matrix.browser }}
        run: pnpm test:integration

  web-native-smoke:
    name: Web native (${{ matrix.os }}, ${{ matrix.browser }})
    needs: [changes, web-build]
    if: needs.changes.outputs.web == 'true'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '[{"os":"ubuntu-24.04","browser":"chromium"},{"os":"windows-2025","browser":"chromium"},{"os":"macos-26","browser":"webkit"},{"os":"ubuntu-24.04-arm","browser":"chromium"},{"os":"windows-11-arm","browser":"chromium"},{"os":"macos-26-intel","browser":"webkit"}]' || '[{"os":"ubuntu-24.04","browser":"chromium"},{"os":"windows-2025","browser":"chromium"},{"os":"macos-26","browser":"webkit"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up web dependencies
        uses: ./.github/actions/setup-web
      - name: Download built website
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: web-built
          path: web/dist
      - name: Set up Playwright browser
        uses: ./.github/actions/setup-playwright
        timeout-minutes: 15
        with:
          browser: ${{ matrix.browser }}
      - name: Test actual browser platform and slow fonts
        working-directory: web
        env:
          PLAYWRIGHT_BROWSER: ${{ matrix.browser }}
        run: pnpm test:built

  install-script-integration:
    needs: changes
    if: needs.changes.outputs.installers == 'true'
    name: Installer (${{ matrix.label }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux sh
            os: ubuntu-24.04
            kind: unix
            shell_name: sh
            test_mode: path
            apt_packages: ''
            brew_packages: ''
            default_toolchain: ''
          - label: linux bash
            os: ubuntu-24.04
            kind: unix
            shell_name: bash
            test_mode: path
            apt_packages: ''
            brew_packages: ''
            default_toolchain: ''
          - label: linux zsh
            os: ubuntu-24.04
            kind: unix
            shell_name: zsh
            test_mode: path
            apt_packages: zsh
            brew_packages: ''
            default_toolchain: ''
          - label: linux fish
            os: ubuntu-24.04
            kind: unix
            shell_name: fish
            test_mode: path
            apt_packages: fish
            brew_packages: ''
            default_toolchain: ''
          - label: linux arm64 sh
            os: ubuntu-24.04-arm
            kind: unix
            shell_name: sh
            test_mode: path
            apt_packages: ''
            brew_packages: ''
            default_toolchain: ''
          - label: macos arm64 bash
            os: macos-26
            kind: unix
            shell_name: bash
            test_mode: path
            apt_packages: ''
            brew_packages: ''
            default_toolchain: ''
          - label: macos arm64 zsh
            os: macos-26
            kind: unix
            shell_name: zsh
            test_mode: path
            apt_packages: ''
            brew_packages: ''
            default_toolchain: ''
          - label: macos arm64 fish
            os: macos-26
            kind: unix
            shell_name: fish
            test_mode: path
            apt_packages: ''
            brew_packages: fish
            default_toolchain: ''
          - label: macos intel bash
            os: macos-26-intel
            kind: unix
            shell_name: bash
            test_mode: path
            apt_packages: ''
            brew_packages: ''
            default_toolchain: ''
          - label: macos intel zsh
            os: macos-26-intel
            kind: unix
            shell_name: zsh
            test_mode: path
            apt_packages: ''
            brew_packages: ''
            default_toolchain: ''
          - label: macos intel fish
            os: macos-26-intel
            kind: unix
            shell_name: fish
            test_mode: path
            apt_packages: ''
            brew_packages: fish
            default_toolchain: ''
          - label: windows powershell legacy host
            os: windows-2025
            kind: powershell
            shell_name: 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
            test_mode: ''
            apt_packages: ''
            brew_packages: ''
            default_toolchain: all
          - label: windows pwsh latest
            os: windows-2025
            kind: powershell
            shell_name: pwsh
            test_mode: ''
            apt_packages: ''
            brew_packages: ''
            default_toolchain: all
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux test shells
        if: matrix.kind == 'unix' && runner.os == 'Linux' && matrix.apt_packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt_packages }}
      - name: Install macOS test shells
        if: matrix.kind == 'unix' && runner.os == 'macOS' && matrix.brew_packages != ''
        run: brew install ${{ matrix.brew_packages }}
      - name: Show Unix shell version
        if: matrix.kind == 'unix'
        run: |
          if command -v ${{ matrix.shell_name }}; then
            ${{ matrix.shell_name }} --version || true
          fi
      - name: Show PowerShell version
        if: matrix.kind == 'powershell'
        shell: pwsh
        env:
          CJV_INSTALL_TEST_POWERSHELL: ${{ matrix.shell_name }}
        run: |
          $shell = Get-Command $env:CJV_INSTALL_TEST_POWERSHELL -ErrorAction Stop
          $shellPath = if ($shell.Path) { $shell.Path } else { $shell.Source }
          & $shellPath -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
      - name: Run install.sh integration
        if: matrix.kind == 'unix'
        env:
          CJV_INSTALL_TEST_SHELL: ${{ matrix.shell_name }}
          CJV_INSTALL_TEST_MODE: ${{ matrix.test_mode }}
        run: sh tests/install-scripts/install-sh.sh
      - name: Run install.ps1 integration
        if: matrix.kind == 'powershell'
        shell: pwsh
        env:
          CJV_INSTALL_TEST_DEFAULT_TOOLCHAIN: ${{ matrix.default_toolchain }}
          CJV_INSTALL_TEST_POWERSHELL: ${{ matrix.shell_name }}
        run: ./tests/install-scripts/install-ps1.ps1

  go-integration:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    name: Go integration (${{ matrix.os }})
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            race: -race
          - os: ubuntu-24.04-arm
            race: -race
          - os: macos-26
            race: -race
          - os: macos-26-intel
            race: -race
          - os: windows-2025
            race: -race
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Run integration tests
        run: go test ${{ matrix.race }} -v -tags integration -count=1 ./tests/integration/
