name: HarmonyOS emulator probe

on:
  push:
    branches: [zxilly/harmonyos-emulator-ci]
    paths:
      - .github/workflows/harmonyos-emulator.yml
      - scripts/harmonyos-emulator/**
  workflow_dispatch:
    inputs:
      runner:
        description: Runner architecture (official Linux CLI currently requires x64)
        type: choice
        options: [ubuntu-24.04, ubuntu-24.04-arm]
        default: ubuntu-24.04

permissions:
  contents: read

concurrency:
  group: harmonyos-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Official CLI (${{ inputs.runner || 'ubuntu-24.04' }})
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Inspect runner hardware
        run: python3 scripts/harmonyos-emulator/probe.py hardware
      - name: Grant runner access to virtualization and rendering devices
        run: |
          if [ -e /dev/kvm ]; then
            sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          fi
          for device in /dev/dri/card* /dev/dri/renderD*; do
            if [ -e "$device" ]; then
              sudo setfacl -m "u:$(id -un):rw" "$device"
            fi
          done
          python3 scripts/harmonyos-emulator/probe.py hardware
      - name: Install official emulator dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libatomic1 libpulse0 libegl1 libgbm1 libgl1 \
            libpng16-16 libfontconfig1 libfreetype6 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1 libsm6 libice6 libxkbcommon-x11-0 \
            libxkbcommon0 libglib2.0-0
      - name: Download and verify official CLI
        run: python3 scripts/harmonyos-emulator/probe.py download
      - name: Probe native CLI and image catalog
        run: python3 scripts/harmonyos-emulator/probe.py cli
      - name: Install and boot HarmonyOS PC emulator
        run: python3 scripts/harmonyos-emulator/probe.py boot
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: harmonyos-emulator-${{ inputs.runner || 'ubuntu-24.04' }}
          path: emulator-diagnostics/
          if-no-files-found: warn
          retention-days: 7
