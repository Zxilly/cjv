name: Deploy website to GitHub Pages and EdgeOne

on:
  push:
    branches: ["master"]
  workflow_call:
    secrets:
      EDGEONE_API_TOKEN:
        required: true
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: web
        run: pnpm build
      - name: Download latest release archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p archives
          gh release download --repo "${GITHUB_REPOSITORY}" --dir archives \
            --pattern 'cjv_*' --pattern 'cjv-mirror_*'
          ls -lh archives
      - name: Extract cjv-init binaries by platform and variant
        run: |
          ARCHIVES_DIR=archives OUT_DIR=web/dist/dl bash scripts/extract-init-binaries.sh
          find web/dist/dl -type f | sort

      # Build the bilingual mdBook into web/dist/book/<lang>/ so it ships with the
      # Pages deploy. Must run after `pnpm build`, which clears web/dist.
      - name: Install mdbook
        env:
          MDBOOK_VERSION: "0.5.3"
        run: |
          mkdir -p "${RUNNER_TEMP}/mdbook-bin"
          curl -fsSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "${RUNNER_TEMP}/mdbook-bin"
          echo "${RUNNER_TEMP}/mdbook-bin" >> "$GITHUB_PATH"

      - name: Build the user guide
        working-directory: docs/user-guide
        run: |
          MDBOOK_OUTPUT__HTML__SITE_URL=/book/user-guide/zh-CN/ mdbook build -d ../../web/dist/book/user-guide/zh-CN
          MDBOOK_BOOK__SRC=en MDBOOK_BOOK__LANGUAGE=en MDBOOK_OUTPUT__HTML__SITE_URL=/book/user-guide/en/ mdbook build -d ../../web/dist/book/user-guide/en

      - name: Build the dev guide
        working-directory: docs/dev-guide
        run: |
          MDBOOK_OUTPUT__HTML__SITE_URL=/book/dev-guide/zh-CN/ mdbook build -d ../../web/dist/book/dev-guide/zh-CN
          MDBOOK_BOOK__SRC=en MDBOOK_BOOK__LANGUAGE=en MDBOOK_OUTPUT__HTML__SITE_URL=/book/dev-guide/en/ mdbook build -d ../../web/dist/book/dev-guide/en

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: 'web/dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  edgeone:
    name: Deploy to EdgeOne Makers
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      EDGEONE_PROJECT_NAME: ${{ vars.EDGEONE_PROJECT_NAME }}
      EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
    steps:
      - name: Check deployment configuration
        run: |
          test -n "$EDGEONE_PROJECT_NAME"
          test -n "$EDGEONE_API_TOKEN"
      - name: Checkout deployment configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download the shared website artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: github-pages
          path: ${{ runner.temp }}/edgeone-artifact
      - name: Extract website
        run: |
          mkdir -p "$RUNNER_TEMP/edgeone-site"
          tar -xf "$RUNNER_TEMP/edgeone-artifact/artifact.tar" -C "$RUNNER_TEMP/edgeone-site"
          test -f "$RUNNER_TEMP/edgeone-site/index.html"
          test -f "$RUNNER_TEMP/edgeone-site/install.sh"
          test -d "$RUNNER_TEMP/edgeone-site/book"
          test -d "$RUNNER_TEMP/edgeone-site/dl"
          test -f "$RUNNER_TEMP/edgeone-site/404.html"
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - name: Login to Tencent Cloud China
        run: npx --yes edgeone@1.6.44 login --site china --token "$EDGEONE_API_TOKEN"
      - name: Build regional homepage edge function
        run: node deployment/build-edge.mjs edgeone "$RUNNER_TEMP/edgeone-site" "$RUNNER_TEMP/edgeone-output"
      - name: Deploy the shared website to Makers
        run: >-
          npx --yes edgeone@1.6.44 makers deploy "$RUNNER_TEMP/edgeone-output"
          --name "$EDGEONE_PROJECT_NAME" --env production --skip-ai-gateway-sync
