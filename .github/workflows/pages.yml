name: Deploy website to GitHub Pages and EdgeOne

on:
  push:
    branches: ["master"]
    paths:
      - .github/workflows/pages.yml
      - .github/actions/setup-web/**
      - web/**
      - docs/user-guide/**
      - docs/dev-guide/**
      - docs/theme/**
      - scripts/build-docs.py
      - scripts/extract-init-binaries.sh
      - scripts/download-release-archives.sh
      - deployment/build-edge.mjs
      - deployment/home-response.mjs
      - deployment/edgeone/**
      - deployment/verify-site.mjs
  workflow_call:
    inputs:
      release_tag:
        description: Stable release tag for website installers; empty resolves latest once
        type: string
        default: ''
    secrets:
      EDGEONE_API_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      release_tag:
        description: Stable release tag for website installers; empty resolves latest once
        type: string
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up web dependencies
        uses: ./.github/actions/setup-web
      - name: Build
        working-directory: web
        run: pnpm build
      - name: Download release archives and checksums from one tag
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: bash scripts/download-release-archives.sh
      - name: Extract cjv-init binaries by platform and variant
        run: |
          ARCHIVES_DIR=archives OUT_DIR=web/dist/dl bash scripts/extract-init-binaries.sh
          find web/dist/dl -type f | sort

      # Must run after `pnpm build`, which clears web/dist.
      - name: Install mdbook
        env:
          MDBOOK_VERSION: "0.5.3"
        run: |
          mkdir -p "${RUNNER_TEMP}/mdbook-bin"
          curl -fsSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "${RUNNER_TEMP}/mdbook-bin"
          echo "${RUNNER_TEMP}/mdbook-bin" >> "$GITHUB_PATH"

      - name: Build and check the bilingual documentation
        run: python3 scripts/build-docs.py

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: 'web/dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  edgeone:
    name: Deploy to EdgeOne Makers
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      EDGEONE_PROJECT_NAME: ${{ vars.EDGEONE_PROJECT_NAME }}
      EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
    steps:
      - name: Check deployment configuration
        run: |
          test -n "$EDGEONE_PROJECT_NAME"
          test -n "$EDGEONE_API_TOKEN"
      - name: Checkout deployment configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download the shared website artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: github-pages
          path: ${{ runner.temp }}/edgeone-artifact
      - name: Extract website
        run: |
          mkdir -p "$RUNNER_TEMP/edgeone-site"
          tar -xf "$RUNNER_TEMP/edgeone-artifact/artifact.tar" -C "$RUNNER_TEMP/edgeone-site"
          test -f "$RUNNER_TEMP/edgeone-site/index.html"
          test -f "$RUNNER_TEMP/edgeone-site/install.sh"
          test -d "$RUNNER_TEMP/edgeone-site/book"
          test -d "$RUNNER_TEMP/edgeone-site/dl"
          test -f "$RUNNER_TEMP/edgeone-site/404.html"
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Login to Tencent Cloud China
        run: npx --yes edgeone@1.6.44 login --site china --token "$EDGEONE_API_TOKEN"
      - name: Build regional homepage edge function
        run: node deployment/build-edge.mjs edgeone "$RUNNER_TEMP/edgeone-site" "$RUNNER_TEMP/edgeone-output/.edgeone"
      - name: Deploy the shared website to Makers
        run: >-
          npx --yes edgeone@1.6.44 makers deploy "$RUNNER_TEMP/edgeone-output/.edgeone"
          --name "$EDGEONE_PROJECT_NAME" --env production --skip-ai-gateway-sync
      - name: Verify production websites
        run: node deployment/verify-site.mjs https://cjv.zxilly.dev/ https://cjv.zxilly.com/
